allowBuilds:
  browser-tabs-lock: false
  core-js: true
  esbuild: true
  lightningcss: true
# solid-js 1.9.x (via TanStack devtools) pins seroval ~1.5, which is
# vulnerable; the fix is in >=1.6.3. Solid only uses Serializer, Feature,
# getCrossReferenceHeader and the web plugins, all unchanged in 1.6.
# Drop once a solid-js release depends on seroval >=1.6.3.
overrides:
  seroval: ^1.6.8
  seroval-plugins: ^1.6.8
  # Devtools' editor launcher must include the Windows command-injection fixes.
  launch-editor: ^2.14.2
# pnpm 12 can link the agent skills a package ships into the agent skill
# directories. TanStack's skills are already loaded on demand through
# @tanstack/intent (see `intent` in package.json and AGENTS.md), so pnpm
# links none. Change an entry to `true` to let pnpm link that package's.
permissions:
  '@tanstack/devtools-vite':
    skills: false
  '@tanstack/react-router':
    skills: false
  '@tanstack/react-start':
    skills: false
  '@tanstack/router-plugin':
    skills: false
