# Local development only. The regular Compose file retains its tunnel boundary.
services:
  backend:
    ports:
      - "127.0.0.1:${BACKEND_PORT}:8000"
    environment:
      CORS_ORIGINS: http://localhost:${WEB_PORT}
      AUTH_VERIFIER_URL: http://frontend:3000/api/auth/internal/verify
    develop:
      watch:
        - action: rebuild
          path: ./backend
          ignore: [target/]
  alexa-bridge:
    develop:
      watch:
        - action: rebuild
          path: ./sidecars/alexa-bridge
          ignore: [.venv/, __pycache__/, .pytest_cache/, .ruff_cache/]
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.dev
    depends_on:
      backend:
        condition: service_healthy
      supertokens:
        condition: service_healthy
        required: false
    environment:
      GROCERY_ENV_FILE: /dev/null
      SERVER_API_BASE_URL: http://backend:8000
      VITE_API_BASE_URL: http://localhost:${BACKEND_PORT}
      VITE_WS_URL: ws://localhost:${BACKEND_PORT}/ws
      VITE_AUTH_MODE: ${VITE_AUTH_MODE:-}
      AUTH_PUBLIC_ORIGIN: http://localhost:${WEB_PORT}
      AUTH_OIDC_DISCOVERY_URL: ${AUTH_OIDC_DISCOVERY_URL:-}
      AUTH_OIDC_CLIENT_ID: ${AUTH_OIDC_CLIENT_ID:-}
      AUTH_OIDC_CLIENT_SECRET: ${AUTH_OIDC_CLIENT_SECRET:-}
      AUTH_VERIFIER_SECRET: ${AUTH_VERIFIER_SECRET:-}
      SUPERTOKENS_CONNECTION_URI: ${SUPERTOKENS_CONNECTION_URI:-}
      SUPERTOKENS_API_KEY: ${SUPERTOKENS_API_KEY:-}
    ports:
      - "127.0.0.1:${WEB_PORT}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      retries: 24
      start_period: 20s
    develop:
      watch:
        - action: sync
          path: ./frontend/src
          target: /workspace/frontend/src
          initial_sync: true
        - action: rebuild
          path: ./frontend
          ignore: [src/, node_modules/, .output/, test-results/, playwright-report/]
        - action: rebuild
          path: ./scripts
